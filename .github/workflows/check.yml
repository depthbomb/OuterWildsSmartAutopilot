name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build and check navigation
        run: dotnet test -c Release -p:RestoreLockedMode=true
      - name: Package mod
        shell: pwsh
        run: ./Package.ps1
